apiVersion: v1
kind: Service
metadata:
  name: dev-csi
  namespace: {{ .Values.namespace }}
  labels:
    app: dev-csi
    app.kubernetes.io/name: dev-csi
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    app: dev-csi
  ports:
    - name: storage-api
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dev-csi
  namespace: {{ .Values.namespace }}
  labels:
    app: dev-csi
    app.kubernetes.io/name: dev-csi
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app: dev-csi
  template:
    metadata:
      labels:
        app: dev-csi
    spec:
      serviceAccountName: dev-csi
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        # 1. DevStorage binary: CSI gRPC + HTTP storage API
        - name: dev-csi
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --socket-path=/csi/csi.sock
            - --staging-dir=/var/lib/dev-csi/volumes
            - --http-addr=:8080
            - --storage-api-url=http://localhost:8080
            - --pool-size-tib={{ .Values.poolSizeTiB }}
            - --v=4
            {{- if .Values.seedVolumes }}
            - --volumes-file=/config/volumes.json
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: storage-api
              containerPort: 8080
          securityContext:
            privileged: true
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: staging-dir
              mountPath: /var/lib/dev-csi/volumes
              mountPropagation: Bidirectional
            {{- if .Values.seedVolumes }}
            - name: seed-config
              mountPath: /config
              readOnly: true
            {{- end }}

        # 2. node-driver-registrar — tells kubelet about our CSI socket
        - name: node-driver-registrar
          image: {{ .Values.sidecars.nodeDriverRegistrar.image }}
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/{{ .Values.driverName }}/csi.sock
            - --v=4
          securityContext:
            privileged: true
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration

        # 3. external-provisioner — watches PVCs and calls CSI CreateVolume
        - name: external-provisioner
          image: {{ .Values.sidecars.provisioner.image }}
          args:
            - --csi-address=/csi/csi.sock
            - --v=4
            - --feature-gates=Topology=true
            - --leader-election
            - --leader-election-namespace={{ .Values.namespace }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi

      volumes:
        - name: socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/{{ .Values.driverName }}
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: staging-dir
          hostPath:
            path: /var/lib/dev-csi/volumes
            type: DirectoryOrCreate
        {{- if .Values.seedVolumes }}
        - name: seed-config
          configMap:
            name: dev-csi-seed-volumes
        {{- end }}
