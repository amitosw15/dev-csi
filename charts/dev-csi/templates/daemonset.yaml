---
# Storage API server — single source of truth for all LUN state.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-csi-api
  namespace: {{ .Values.namespace }}
  labels:
    app: dev-csi-api
    app.kubernetes.io/name: dev-csi
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dev-csi-api
  template:
    metadata:
      labels:
        app: dev-csi-api
    spec:
      serviceAccountName: dev-csi
      containers:
        - name: dev-csi-api
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --socket-path=
            - --http-addr=:8080
            - --pool-size-tib={{ .Values.poolSizeTiB }}
            - --v=4
            {{- if .Values.seedVolumes }}
            - --volumes-file=/config/volumes.json
            {{- end }}
          ports:
            - name: storage-api
              containerPort: 8080
          {{- if .Values.seedVolumes }}
          volumeMounts:
            - name: seed-config
              mountPath: /config
              readOnly: true
          {{- end }}
      {{- if .Values.seedVolumes }}
      volumes:
        - name: seed-config
          configMap:
            name: dev-csi-seed-volumes
      {{- end }}
---
# Service for the storage API.
# Use: STORAGE_HOSTNAME=http://dev-csi-api.{{ .Values.namespace }}.svc:8080
apiVersion: v1
kind: Service
metadata:
  name: dev-csi-api
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: dev-csi
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    app: dev-csi-api
  ports:
    - name: storage-api
      port: 8080
      targetPort: 8080
---
# CSI node plugin DaemonSet — stateless, delegates to dev-csi-api Service.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dev-csi
  namespace: {{ .Values.namespace }}
  labels:
    app: dev-csi
    app.kubernetes.io/name: dev-csi
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app: dev-csi
  template:
    metadata:
      labels:
        app: dev-csi
    spec:
      serviceAccountName: dev-csi
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: dev-csi
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --socket-path=/csi/csi.sock
            - --staging-dir=/var/lib/dev-csi/volumes
            - --http-addr=
            - --storage-api-url=http://dev-csi-api.{{ .Values.namespace }}.svc:8080
            - --v=4
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: staging-dir
              mountPath: /var/lib/dev-csi/volumes
              mountPropagation: Bidirectional

        - name: node-driver-registrar
          image: {{ .Values.sidecars.nodeDriverRegistrar.image }}
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/{{ .Values.driverName }}/csi.sock
            - --v=4
          securityContext:
            privileged: true
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration

        - name: external-provisioner
          image: {{ .Values.sidecars.provisioner.image }}
          args:
            - --csi-address=/csi/csi.sock
            - --v=4
            - --feature-gates=Topology=true
            - --leader-election
            - --leader-election-namespace={{ .Values.namespace }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi

      volumes:
        - name: socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/{{ .Values.driverName }}
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: staging-dir
          hostPath:
            path: /var/lib/dev-csi/volumes
            type: DirectoryOrCreate
