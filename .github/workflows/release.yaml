name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main

env:
  IMAGE: quay.io/amitosw15/dev-csi

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Determine image tags
        id: tags
        run: |
          TAGS="${{ env.IMAGE }}:devel"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            TAGS="$TAGS,${{ env.IMAGE }}:${VERSION},${{ env.IMAGE }}:latest"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## DevStorage ${{ steps.tags.outputs.version }}

            ### Install
            ```bash
            kubectl apply -f https://raw.githubusercontent.com/amitosw15/dev-csi/${{ steps.tags.outputs.version }}/deploy/dev-csi.yaml
            ```

            ### Image
            ```
            quay.io/amitosw15/dev-csi:${{ steps.tags.outputs.version }}
            ```
